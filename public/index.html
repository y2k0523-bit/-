<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>타자 레이스 18</title><style>body{margin:0;background:#101b30;color:#f4f7ff;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}h1{color:#facc15}section{background:#1c2a42;border:1px solid #35445b;border-radius:16px;padding:18px;margin:14px 0}button,input,textarea{font:inherit;border-radius:10px;padding:12px;box-sizing:border-box}button{background:#facc15;color:#111827;border:0;font-weight:800;cursor:pointer;margin:5px}button:disabled{opacity:.4}input,textarea{width:100%;background:#0c1628;color:white;border:1px solid #50617b;margin:6px 0}textarea{height:200px}.hidden{display:none}.track{height:23px;background:#34445f;position:relative;border-radius:7px;flex:1;margin:0 8px}.runner{position:absolute;top:-5px;transition:left .2s}.lane{display:flex;align-items:center;margin:8px 0;font-size:13px}.name{width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pct{width:40px;text-align:right}.finish{position:absolute;right:5px;top:0}.muted{color:#b4c3d9}.card{color:#facc15}#qrcode{background:white;padding:10px;width:210px;height:210px;margin:12px auto}#qrcode img{width:210px;height:210px}#target{font-size:22px;line-height:1.6;background:#0d192c;padding:16px;border-radius:10px}#typing{font-size:19px}a{color:#93c5fd;overflow-wrap:anywhere}#status{color:#86efac}</style><main><h1>🏁 타자 레이스 18</h1><p id="status">연결 중…</p><section id="home"><h2>참가하기</h2><div id="roomWrap"><label>방 코드<input id="room" inputmode="numeric" maxlength="6" placeholder="6자리"></label></div><label>이름 또는 번호<input id="studentName" maxlength="18" placeholder="예: 3번 김하늘"></label><button id="join">🏃 학생 입장</button><hr><button id="create">👩‍🏫 교사: 새 경기 만들기</button></section><section id="teacher" class="hidden"><h2>교사용 운영 화면</h2><h2>방 코드: <span id="code"></span></h2><p>학생들이 아래 QR코드를 스캔하고 이름을 입력하면 입장합니다.</p><div id="qrcode"></div><p><a id="joinUrl"></a></p><h3>레이스 본문</h3><textarea id="passage"></textarea><button id="save">본문 적용</button><button id="start">🚩 모두 출발</button><button id="reset">↩ 기록 초기화</button></section><section id="student" class="hidden"><h2 id="hello">학생</h2><p id="studentStatus"></p><div id="target"></div><input id="typing" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="여기에 문장을 입력하세요"><p id="feedback" class="card"></p></section><section id="race" class="hidden"><h2>🏆 실시간 레이스 <span id="count"></span></h2><p id="phase"></p><div id="board"></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let ws,role='',code='',token='',pid='',state=null,localText='',retry=0;const show=(id,on)=>$(id).classList.toggle('hidden',!on),send=m=>{if(ws?.readyState===1)ws.send(JSON.stringify(m))},saveSession=()=>sessionStorage.setItem('race18_session',JSON.stringify({role,code,token,pid})),getSession=()=>{try{return JSON.parse(sessionStorage.getItem('race18_session')||'null')}catch{return null}},joinLink=()=>{const u=new URL(location.href);u.search='';u.searchParams.set('room',code);return u.href};function qr(){if(!code)return;const link=joinLink();$('joinUrl').href=link;$('joinUrl').textContent=link;$('qrcode').replaceChildren();if(window.QRCode)new QRCode($('qrcode'),{text:link,width:210,height:210});else $('qrcode').textContent='QR 생성 라이브러리를 불러오지 못했습니다. 위 링크를 공유하세요.'}function connect(){ws=new WebSocket(location.origin.replace(/^http/,'ws'));ws.onopen=()=>{$('status').textContent='🟢 서버 연결됨';retry=0;const s=getSession();if(s?.token){({role,code,token,pid}=s);send(role==='teacher'?{type:'resumeTeacher',code,token}:{type:'resumeStudent',code,token,pid})}};ws.onclose=()=>{$('status').textContent='🔴 재연결 중';setTimeout(connect,Math.min(10000,1000+retry++*1000))};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){alert(m.message);if(m.message.includes('인증')||m.message.includes('방을 찾을')){sessionStorage.removeItem('race18_session');show('home',true)}return}if(m.type==='auth'){({role,code,token,pid}=m);saveSession();show('home',false);show('teacher',role==='teacher');show('student',role==='student');if(role==='teacher')qr();return}if(m.type==='rollback'){$('typing').value='';localText='';$('feedback').textContent='🟥 오타 2회! 문장 처음으로 복귀';return}if(m.type==='next'){$('typing').value='';localText='';$('feedback').textContent='✅ 문장 통과';return}if(m.type==='finish'){$('typing').value='';$('feedback').textContent='🏆 완주!';return}if(m.type==='state'){state=m;code=m.code;render()}}}function render(){if(!state)return;show('home',false);show('race',true);show('teacher',role==='teacher');show('student',role==='student');$('count').textContent=state.players.length+'/18';$('phase').textContent=state.phase==='running'?'🟢 경기 중':'🟡 출발 대기';if(role==='teacher'){$('code').textContent=code;if(!$('qrcode').children.length)qr();if(document.activeElement!==$('passage'))$('passage').value=state.lines.join('\n');$('start').disabled=state.phase!=='waiting'||!state.players.length;$('save').disabled=state.phase!=='waiting'}if(role==='student'){const p=state.players.find(p=>p.id===pid);if(p){$('hello').textContent='🏃 '+p.name;$('studentStatus').textContent=(Math.min(p.idx+1,state.lines.length))+'/'+state.lines.length+' 문장 · '+Math.floor(100*p.done/Math.max(1,state.total))+'% · 옐로카드 '+p.errors+'/1';$('target').textContent=state.lines[p.idx]||'🏆 완주!';$('typing').disabled=state.phase!=='running'||p.idx>=state.lines.length;if(p.errors===1)$('feedback').textContent='🟨 옐로카드! 다음 오타는 문장 처음으로 복귀'}}const board=$('board');board.replaceChildren();const sorted=[...state.players].sort((a,b)=>b.done-a.done||(a.finishedAt||Infinity)-(b.finishedAt||Infinity));for(const [i,p]of sorted.entries()){const lane=document.createElement('div');lane.className='lane';const name=document.createElement('span');name.className='name';name.textContent=(i+1)+'. '+p.name+(p.online?'':' ⚪');const track=document.createElement('div');track.className='track';const runner=document.createElement('span');runner.className='runner';runner.textContent=p.finishedAt?'🏆':'🏃';runner.style.left=Math.min(93,93*p.done/Math.max(1,state.total))+'%';const flag=document.createElement('span');flag.className='finish';flag.textContent='🏁';track.append(runner,flag);const pct=document.createElement('span');pct.className='pct';pct.textContent=Math.floor(100*p.done/Math.max(1,state.total))+'%';lane.append(name,track,pct);board.append(lane)}}$('create').onclick=()=>send({type:'create'});$('join').onclick=()=>{const c=$('room').value.trim(),name=$('studentName').value.trim();if(!/^\d{6}$/.test(c)||!name)return alert('방 코드와 이름을 입력하세요');send({type:'join',code:c,name})};$('save').onclick=()=>send({type:'setText',code,text:$('passage').value});$('start').onclick=()=>send({type:'start',code});$('reset').onclick=()=>{if(confirm('기록을 초기화할까요?'))send({type:'reset',code})};$('typing').addEventListener('input',e=>{if(e.isComposing||role!=='student'||!state)return;const value=e.target.value;if(value!==localText){localText=value;send({type:'type',code,value})}});$('typing').addEventListener('compositionend',e=>{const value=e.target.value;if(value!==localText){localText=value;send({type:'type',code,value})}});$('typing').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});if(params.get('room')){$('room').value=params.get('room');show('roomWrap',false);show('create',false)}connect();
</script></html>
